[project]
name = "food-analyzer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.2.2",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort (import order)
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear (common bug patterns)
    "C4",   # comprehensions
    "SIM",  # simplify
    "ARG",  # unused arguments
    "BLE",  # no bare/broad except
    "D",    # pydocstyle (docstrings)
]
ignore = [
    "D203", # conflicts with D211
    "D213", # conflicts with D212
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends()/File() defaults are the framework's documented
# pattern, not the bug B008 normally guards against.
"app/main.py" = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]
